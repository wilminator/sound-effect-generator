name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg (used to check MP3 and OGG exports)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright and Chromium (browser tests)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: npm test
